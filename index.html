<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XV Años - Alison Flores Pretel</title>
<link rel="stylesheet" href="style.css?v=6">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

<div id="welcomeScreen" class="welcome-screen">
  <div id="flowerRain" class="flower-rain" aria-hidden="true"></div>
  <div class="envelope-container">
    <button id="envelope" class="invitation-card" type="button" aria-label="Abrir invitación">
      <img src="img/carta.png" alt="Carta de invitación">
    </button>
  </div>
</div>

<div id="mainContent" class="hidden">
<div id="contentFlowers" class="flower-rain content-flowers" aria-hidden="true"></div>
<audio id="bgMusic" loop>
<source src="music/dream-lisa.mp3" type="audio/mpeg">
</audio>

<div id="musicBtn" class="music-disc">
<img src="img/portamusic.jpg" alt="Alison">
</div>

<section class="music-cover">
<div class="music-cover-content">
<h2>Mis Quince Años</h2>
<div class="music-player">
<input id="musicProgress" class="music-progress" type="range" min="0" max="100" value="0" aria-label="Progreso de la canción">
<div class="music-controls" aria-label="Controles de música">
<button type="button" class="control-btn" aria-label="Mezclar canción">↬</button>
<button type="button" id="backBtn" class="control-btn" aria-label="Regresar canción">‹</button>
<button type="button" id="coverPlayBtn" class="control-btn heart-btn" aria-label="Reproducir o pausar canción">♥</button>
<button type="button" id="nextBtn" class="control-btn" aria-label="Adelantar canción">›</button>
<button type="button" class="control-btn" aria-label="Repetir canción">↻</button>
</div>
<p>Presiona el ♥ para escuchar mi canción</p>
</div>
</div>
</section>

<section class="quince-com-section" aria-label="Detalle de quince años">
<div class="quince-com-crop">
<div class="quince-com-frame">
<img src="img/quince-com.png" alt="Quince años de Alison">
<div id="countdown" class="countdown-overlay" aria-label="Cuenta regresiva"></div>
<a class="gold-overlay location-link" href="https://maps.app.goo.gl/M3mkk83zXP5iVgUu5" target="_blank" rel="noopener">Ver mapa</a>
<a class="gold-overlay confirm-link confirm-alison" href="https://wa.me/51934577094?text=Hola%20Alison%2C%20confirmo%20mi%20asistencia%20a%20tus%2015%20a%C3%B1os." target="_blank" rel="noopener">Alison</a>
<a class="gold-overlay confirm-link confirm-mama" href="https://wa.me/51934577094?text=Hola%2C%20mam%C3%A1%20de%20Alison%2C%20confirmo%20mi%20asistencia%20a%20los%2015%20a%C3%B1os%20de%20Alison." target="_blank" rel="noopener">Mama de Ali</a>
</div>
</div>
</section>

</div>
<script src="script.js?v=6"></script>
</body>
</html>
